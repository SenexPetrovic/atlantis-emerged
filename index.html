<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atlantis Emerged Radio</title>

<meta http-equiv="refresh" content="120">

<style>

body{
    margin:0;
    padding:0;
    height:100vh;

    background:
    radial-gradient(circle at top,
        #1a5f7a 0%,
        #0b2e46 35%,
        #051522 100%);

    font-family: Arial, Helvetica, sans-serif;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;
}

.panel{

    width:90%;
    max-width:900px;

    background:rgba(0,20,35,.75);

    border:2px solid rgba(0,255,255,.25);

    border-radius:20px;

    padding:30px;

    text-align:center;

    box-shadow:
        0 0 30px rgba(0,255,255,.15),
        inset 0 0 40px rgba(0,255,255,.05);
}

.station{

    font-size:38px;
    font-weight:bold;
    letter-spacing:4px;

    color:#8ffcff;

    text-shadow:
        0 0 10px rgba(0,255,255,.6);

    margin-bottom:20px;
}

.cover{

    width:320px;
    max-width:80%;

    border-radius:16px;

    box-shadow:
        0 0 25px rgba(0,255,255,.25);

    margin-bottom:25px;
}

.song{

    font-size:34px;
    font-weight:bold;

    margin-bottom:10px;
}

.artist{

    font-size:24px;

    color:#8ffcff;

    margin-bottom:15px;
}

.album{

    font-size:18px;

    color:#c8d9e3;

    margin-bottom:25px;
}

.footer{

    display:flex;
    justify-content:center;
    gap:40px;

    font-size:18px;

    color:#9fd7e5;
}

.label{

    opacity:.75;
}

</style>

</head>

<body>

<div class="panel">

<div class="station">
    <img src="Atlantis%20Logo%20Jun26%20BySX.png" class="logo">
</div>

    <img class="cc_streaminfo cover"
         data-type="trackimageurl"
         data-username="francisc">

    <div class="song">
        <span class="cc_streaminfo"
              data-type="tracktitle"
              data-username="francisc"></span>
    </div>

    <div class="artist">
        <span class="cc_streaminfo"
              data-type="trackartist"
              data-username="francisc"></span>
    </div>

    <div class="album">
        <span class="cc_streaminfo"
              data-type="trackalbum"
              data-username="francisc"></span>
    </div>

    <div class="footer">

        <div>
            <span class="label">Listeners</span><br>
            <span class="cc_streaminfo"
                  data-type="listeners"
                  data-username="francisc"></span>
        </div>

        <div>
            <span class="label">Bitrate</span><br>
            <span class="cc_streaminfo"
                  data-type="bitrate"
                  data-username="francisc"></span>
        </div>

    </div>

</div>

<script src="https://falcon.shoutca.st/system/streaminfo.js"></script>

</body>
</html>
