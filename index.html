<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Atlantis Emerged Radio</title>
   
<style>
body{
    background:#081a2b;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:20px;
}

.cover{
    width:300px;
    max-width:90%;
    border-radius:10px;
}

.title{
    font-size:28px;
    font-weight:bold;
    margin-top:15px;
}

.artist{
    font-size:20px;
    color:#7fdfff;
}

.album{
    font-size:16px;
    color:#cccccc;
}
</style>

</head>

<body>

<h1>Atlantis Emerged</h1>

<img class="cc_streaminfo cover"
     data-type="trackimageurl"
     data-username="francisc">

<div class="title">
    <span class="cc_streaminfo"
          data-type="tracktitle"
          data-username="francisc"></span>
</div>

<div class="artist">
    <span class="cc_streaminfo"
          data-type="trackartist"
          data-username="francisc"></span>
</div>

<div class="album">
    <span class="cc_streaminfo"
          data-type="trackalbum"
          data-username="francisc"></span>
</div>

<br>

Listeners:
<span class="cc_streaminfo"
      data-type="listeners"
      data-username="francisc"></span>

<script src="https://falcon.shoutca.st/system/streaminfo.js"></script>

</body>
</html>
