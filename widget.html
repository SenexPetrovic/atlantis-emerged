<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATLANTIS EMERGED RADIO NETWORK</title>
<meta http-equiv="refresh" content="120">

<style>
/* TUS ESTILOS EXISTENTES - no cambian nada */
body{ margin:0; padding:0; min-height:100vh; background: radial-gradient(circle at top, #1a5f7a 0%, #0b2e46 35%, #051522 100%); font-family: Arial, Helvetica, sans-serif; color:white; display:flex; justify-content:center; align-items:center; }
.panel{ width:95%; max-width:1400px; background:rgba(0,20,35,.75); border:2px solid rgba(0,255,255,.25); border-radius:20px; padding:25px; box-shadow: 0 0 30px rgba(0,255,255,.15), inset 0 0 40px rgba(0,255,255,.05); }
.logo{ display:block; margin:0 auto 20px auto; width:680px; max-width:90%; height:auto; filter: drop-shadow(0 0 12px rgba(0,255,255,.4)) drop-shadow(0 0 25px rgba(0,255,255,.2)); }
.main{ display:flex; gap:30px; align-items:center; }
.cover{ width:420px; max-width:35vw; border-radius:16px; box-shadow: 0 0 25px rgba(0,255,255,.25); }
.network{ color:#8ffcff; font-size:16px; letter-spacing:4px; text-transform:uppercase; opacity:.75; margin-bottom:10px; }
.info{ flex:1; }
.nowplaying{ color:#8ffcff; font-size:18px; letter-spacing:3px; margin-bottom:15px; }
.song{ font-size:48px; font-weight:bold; margin-bottom:10px; }
.artist{ font-size:32px; color:#8ffcff; margin-bottom:10px; }
.album{ font-size:22px; color:#c8d9e3; margin-bottom:25px; }
.footer{ display:flex; gap:40px; font-size:18px; }
.label{ opacity:.7; }
.history-title{ margin-top:30px; color:#8ffcff; font-size:18px; letter-spacing:3px; text-transform:uppercase; border-top:1px solid rgba(0,255,255,.2); padding-top:20px; }
.history{ margin-top:10px; background:rgba(0,0,0,.20); border-radius:12px; padding:10px; color:#d6f7ff; font-size:16px; width:100%; box-sizing:border-box; }
.cc_recenttracks_list{ width:100%; font-size:18px; text-align:left; column-count:2; column-gap:30px; }
.live{ color:#8ffcff; font-weight:bold; text-shadow: 0 0 8px rgba(0,255,255,.7); }
</style>

<!-- NUEVO: Script que lee username de URL y carga dinámicamente -->
<script>
const urlParams = new URLSearchParams(window.location.search);
const USERNAME = urlParams.get('username') || 'francisc';

// Esperar a que el DOM esté listo
document.addEventListener('DOMContentLoaded', function() {
    // Actualizar todos los elementos con data-username
    document.querySelectorAll('[data-username]').forEach(el => {
        el.setAttribute('data-username', USERNAME);
    });
    
    // Actualizar el div de recent tracks
    const recentDiv = document.querySelector('.cc_recenttracks_list');
    if (recentDiv) recentDiv.setAttribute('data-username', USERNAME);
    
    // Cargar los scripts de Shoutca.st
    const s1 = document.createElement('script');
    s1.src = 'https://falcon.shoutca.st/system/streaminfo.js';
    document.body.appendChild(s1);
    
    const s2 = document.createElement('script');
    s2.src = 'https://falcon.shoutca.st/system/recenttracks.js';
    document.body.appendChild(s2);
});
</script>
</head>

<body>
<div class="panel">
    <img src="logo.png" class="logo">
    <div class="main">
        <img class="cc_streaminfo cover" data-type="trackimageurl" data-username="francisc">
        <div class="info">
            <div class="network">ATLANTIS EMERGED RADIO</div>
            <div class="nowplaying">NOW PLAYING</div>
            <div class="song"><span class="cc_streaminfo" data-type="tracktitle" data-username="francisc"></span></div>
            <div class="artist"><span class="cc_streaminfo" data-type="trackartist" data-username="francisc"></span></div>
            <div class="album">Album: <span class="cc_streaminfo" data-type="trackalbum" data-username="francisc"></span></div>
            <div class="footer">
                <div><span class="label">Listeners</span><br><span class="cc_streaminfo" data-type="listeners" data-username="francisc"></span></div>
                <div><span class="label">Bitrate</span><br><span class="cc_streaminfo" data-type="bitrate" data-username="francisc"></span></div>
                <div><span class="label">Stream</span><br><span class="cc_streaminfo" data-type="server" data-username="francisc"></span></div>
                <div><span class="label">Status</span><br><span class="live">LIVE</span></div>
            </div>
        </div>
    </div>
    <div class="history-title">Recent Tracks</div>
    <div class="history">
        <div class="cc_recenttracks_list" data-username="francisc">Loading...</div>
    </div>
</div>
</body>
</html>
