<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Universal Radio Widget - Auto Detect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a2a3a 0%, #04121c 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .widget {
            max-width: 550px;
            width: 100%;
            background: rgba(0, 30, 45, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 25px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
        }

        .station-name {
            text-align: center;
            font-size: 16px;
            letter-spacing: 2px;
            color: #8ffcff;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
            word-break: break-word;
        }

        .cover {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 20px;
            object-fit: cover;
            background: #0a2a3a;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .now-playing {
            text-align: center;
            margin-bottom: 20px;
        }

        .now-playing-label {
            font-size: 11px;
            letter-spacing: 2px;
            color: #8ffcff;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .song-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .artist {
            font-size: 15px;
            color: #8ffcff;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            padding: 12px 0;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: #8ffcff;
        }

        .status-live {
            color: #00ff88;
            text-shadow: 0 0 8px #00ff88;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .history-title {
            font-size: 13px;
            letter-spacing: 2px;
            color: #8ffcff;
            margin-bottom: 12px;
            text-align: center;
        }

        .history-list {
            max-height: 250px;
            overflow-y: auto;
            font-size: 12px;
            color: #cceef5;
        }

        .history-item {
            padding: 8px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .history-item img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            background: #0a2a3a;
        }

        .history-info {
            flex: 1;
        }

        .history-song {
            font-weight: bold;
            font-size: 12px;
        }

        .history-artist {
            font-size: 10px;
            opacity: 0.7;
        }

        .diagnostic {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 10px;
            margin-top: 15px;
            font-size: 10px;
            font-family: monospace;
            color: #aaa;
            text-align: left;
            word-break: break-all;
        }

        .footer {
            text-align: center;
            font-size: 9px;
            opacity: 0.4;
            margin-top: 15px;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #8ffcff;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="widget" id="widget">
        <div class="station-name" id="stationName">Loading...</div>
        <img class="cover" id="cover" src="" alt="Album Art">
        <div class="now-playing">
            <div class="now-playing-label">NOW PLAYING</div>
            <div class="song-title" id="songTitle">--</div>
            <div class="artist" id="artist">--</div>
        </div>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="listeners">--</div>
                <div class="stat-label">LISTENERS</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="bitrate">--</div>
                <div class="stat-label">KBPS</div>
            </div>
            <div class="stat">
                <div class="stat-value status-live" id="status">LIVE</div>
                <div class="stat-label">STATUS</div>
            </div>
        </div>
        <div class="history-title">RECENT TRACKS</div>
        <div class="history-list" id="historyList">
            <div class="history-item">Waiting for tracks...</div>
        </div>
        <div class="diagnostic" id="diagnostic"></div>
        <div class="footer">
            SL Stream Widget System | Universal v2
        </div>
    </div>

    <script>
        // ========== CONFIGURACIÓN ==========
        const urlParams = new URLSearchParams(window.location.search);
        let STREAM_URL = urlParams.get('url') || urlParams.get('stream');
        
        const DEFAULT_LOGO = 'https://via.placeholder.com/180x180/0a2a3a/8ffcff?text=Radio';
        const PROXY = 'https://api.allorigins.win/raw?url=';
        
        // Si no hay URL, mostrar ayuda
        if (!STREAM_URL) {
            document.getElementById('stationName').textContent = '❌ No URL provided';
            document.getElementById('diagnostic').innerHTML = 'Usage: ?url=https://server:port/stream';
        }
        
        // Extraer base del servidor
        let baseServer = STREAM_URL.replace(/\/stream$/, '').replace(/\/live$/, '').replace(/\/$/, '');
        
        // ========== ESTADO ==========
        let history = [];
        let lastSongKey = '';
        let currentEndpoint = null; // Guardará qué endpoint funciona
        
        // ========== ELEMENTOS DOM ==========
        const stationNameEl = document.getElementById('stationName');
        const coverEl = document.getElementById('cover');
        const songTitleEl = document.getElementById('songTitle');
        const artistEl = document.getElementById('artist');
        const listenersEl = document.getElementById('listeners');
        const bitrateEl = document.getElementById('bitrate');
        const statusEl = document.getElementById('status');
        const historyListEl = document.getElementById('historyList');
        const diagnosticEl = document.getElementById('diagnostic');
        
        // ========== FUNCIONES ==========
        
        function setDiagnostic(msg) {
            diagnosticEl.innerHTML = msg;
            console.log('[DIAG]', msg);
        }
        
        async function fetchAlbumArt(artist, title) {
            if (!artist && !title) return null;
            const query = encodeURIComponent(`${artist} ${title}`.trim());
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100', '600x600');
                }
            } catch(e) {}
            return null;
        }
        
        function renderHistory() {
            if (history.length === 0) {
                historyListEl.innerHTML = '<div class="history-item">No recent tracks yet...</div>';
                return;
            }
            historyListEl.innerHTML = history.map(item => `
                <div class="history-item">
                    <img src="${item.albumArt || DEFAULT_LOGO}" onerror="this.src='${DEFAULT_LOGO}'">
                    <div class="history-info">
                        <div class="history-song">${escapeHtml(item.title)}</div>
                        <div class="history-artist">${escapeHtml(item.artist)}</div>
                    </div>
                </div>
            `).join('');
        }
        
        function addToHistory(title, artist, albumArt) {
            history.unshift({ title: title || 'Unknown', artist: artist || 'Unknown', albumArt: albumArt || DEFAULT_LOGO, timestamp: Date.now() });
            if (history.length > 10) history.pop();
            renderHistory();
        }
        
        function escapeHtml(str) {
            if (!str) return '--';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function parseTitle(fullTitle) {
            if (!fullTitle || fullTitle === '--') return { artist: '', title: '--' };
            let artist = '', title = fullTitle;
            if (fullTitle.includes(' - ')) {
                let parts = fullTitle.split(' - ');
                artist = parts[0];
                title = parts.slice(1).join(' - ');
            } else if (fullTitle.includes('–')) {
                let parts = fullTitle.split('–');
                artist = parts[0].trim();
                title = parts[1].trim();
            }
            return { artist, title };
        }
        
        // Detectar endpoint automáticamente
        async function detectEndpoint() {
            const endpoints = [
                { name: 'Shoutcast v2', url: `${baseServer}/stats?sid=1&json=1`, parser: parseShoutcastV2 },
                { name: 'Icecast', url: `${baseServer}/status-json.xsl`, parser: parseIcecast },
                { name: 'Shoutcast Legacy', url: `${baseServer}/7.html`, parser: parseShoutcastLegacy }
            ];
            
            for (let ep of endpoints) {
                try {
                    setDiagnostic(`Probando ${ep.name}: ${ep.url}`);
                    const response = await fetch(PROXY + encodeURIComponent(ep.url));
                    if (!response.ok) continue;
                    const text = await response.text();
                    let data;
                    if (ep.name === 'Shoutcast Legacy') {
                        data = text;
                    } else {
                        try { data = JSON.parse(text); } catch(e) { continue; }
                    }
                    const testResult = ep.parser(data);
                    if (testResult && testResult.songtitle) {
                        setDiagnostic(`✅ Conectado vía ${ep.name}`);
                        return ep;
                    }
                } catch(e) {
                    continue;
                }
            }
            setDiagnostic('❌ No se pudo conectar a ningún endpoint');
            return null;
        }
        
        function parseShoutcastV2(data) {
            if (!data || typeof data !== 'object') return null;
            return {
                songtitle: data.songtitle || null,
                listeners: data.currentlisteners || 0,
                bitrate: data.bitrate || 0,
                servertitle: data.servertitle || null
            };
        }
        
        function parseIcecast(data) {
            try {
                let source = data.icestats?.source;
                if (Array.isArray(source)) source = source.find(s => s.listenurl?.includes('/stream')) || source[0];
                if (!source) return null;
                return {
                    songtitle: source.title || null,
                    listeners: source.listeners || 0,
                    bitrate: source.bitrate || 0,
                    servertitle: data.icestats?.server_name || null
                };
            } catch(e) { return null; }
        }
        
        function parseShoutcastLegacy(html) {
            const match = html.match(/(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(.+)/);
            if (!match) return null;
            return {
                songtitle: match[7] || null,
                listeners: parseInt(match[0]) || 0,
                bitrate: parseInt(match[5]) || 0,
                servertitle: null
            };
        }
        
        async function fetchData() {
            if (!currentEndpoint) {
                currentEndpoint = await detectEndpoint();
                if (!currentEndpoint) return;
            }
            
            try {
                const response = await fetch(PROXY + encodeURIComponent(currentEndpoint.url));
                if (!response.ok) throw new Error();
                const text = await response.text();
                let data = currentEndpoint.parser(currentEndpoint.name === 'Shoutcast Legacy' ? text : JSON.parse(text));
                if (!data || !data.songtitle) throw new Error();
                
                if (data.servertitle) stationNameEl.textContent = data.servertitle.substring(0, 50);
                const { artist, title } = parseTitle(data.songtitle);
                songTitleEl.textContent = title || '--';
                artistEl.textContent = artist || '--';
                listenersEl.textContent = data.listeners || '--';
                bitrateEl.textContent = data.bitrate || '--';
                statusEl.textContent = 'LIVE';
                statusEl.style.color = '#00ff88';
                
                const currentKey = `${artist}|${title}`;
                if (currentKey !== lastSongKey && title !== '--') {
                    lastSongKey = currentKey;
                    const albumArt = await fetchAlbumArt(artist, title);
                    coverEl.src = albumArt || DEFAULT_LOGO;
                    addToHistory(title, artist, albumArt);
                }
            } catch(e) {
                statusEl.textContent = 'OFFLINE';
                statusEl.style.color = '#ff4444';
                setDiagnostic(`⚠️ Error: ${e.message}`);
            }
        }
        
        // Iniciar
        coverEl.src = DEFAULT_LOGO;
        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
